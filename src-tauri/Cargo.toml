[package]
name = "campura-camap-composer"
version = "0.1.0"
description = "万卷图 Campus Map Studio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Devices_Geolocation", "Foundation", "Win32_System_WinRT"] }
windows-future = "0.3.2"
